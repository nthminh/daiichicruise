<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daiichi Cruise Manager — Quản Trị Tàu & Đồng Bộ Dữ Liệu Supabase</title>
<link rel="icon" href="/favicon.ico" />
<meta name="robots" content="noindex,nofollow" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../customer/site.css" />
<link rel="stylesheet" href="../customer/cruise-luxury.css" />
<link rel="stylesheet" href="admin.css" />
<style>
  body { background: #071224; color: #E2E8F0; font-family: var(--font-ui, -apple-system, sans-serif); margin: 0; padding: 0; }
  .cm-header { background: #0F1F38; border-bottom: 1px solid rgba(212,166,72,0.3); padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .cm-brand { display: flex; align-items: center; gap: 14px; }
  .cm-brand img { height: 38px; background: #fff; border-radius: 6px; padding: 2px 6px; }
  .cm-brand h1 { font-family: var(--font-display, serif); font-size: 20px; color: #fff; margin: 0; }
  .cm-brand h1 span { color: #F59E0B; }
  .cm-brand .badge { background: rgba(16,185,129,0.2); color: #34D399; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(16,185,129,0.4); }

  .cm-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cm-btn { padding: 9px 18px; border-radius: 8px; font-weight: 700; font-size: 13.5px; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: all .2s; }
  .cm-btn-sync { background: linear-gradient(135deg, #10B981, #059669); color: #fff; box-shadow: 0 4px 14px rgba(16,185,129,0.3); }
  .cm-btn-sync:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .cm-btn-gold { background: linear-gradient(135deg, #F59E0B, #D97706); color: #111E2E; font-weight: 800; }
  .cm-btn-gold:hover { filter: brightness(1.1); }
  .cm-btn-ghost { background: rgba(255,255,255,0.08); color: #E2E8F0; border: 1px solid rgba(255,255,255,0.15); }
  .cm-btn-ghost:hover { background: rgba(255,255,255,0.15); color: #fff; }

  .cm-container { max-width: 1320px; margin: 0 auto; padding: 28px 24px 80px; }
  
  .cm-sync-banner { background: linear-gradient(135deg, rgba(16,36,65,0.9) 0%, rgba(8,18,36,0.95) 100%); border: 1.5px solid rgba(212,166,72,0.4); border-radius: 16px; padding: 22px 26px; margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px; }
  .cm-sync-info h2 { font-size: 18px; color: #fff; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
  .cm-sync-info p { margin: 0; font-size: 13.5px; color: #94A3B8; line-height: 1.5; }
  .cm-sync-stats { display: flex; gap: 20px; }
  .cm-stat-box { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 16px; text-align: center; }
  .cm-stat-box b { display: block; font-size: 20px; color: #F59E0B; }
  .cm-stat-box span { font-size: 11px; color: #94A3B8; text-transform: uppercase; letter-spacing: .06em; }

  .cm-tabs { display: flex; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 26px; }
  .cm-tab { background: transparent; border: 0; color: #94A3B8; font-size: 15px; font-weight: 700; padding: 12px 20px; border-radius: 8px 8px 0 0; cursor: pointer; transition: all .2s; border-bottom: 3px solid transparent; }
  .cm-tab:hover { color: #fff; }
  .cm-tab.active { color: #F59E0B; border-bottom-color: #F59E0B; background: rgba(212,166,72,0.06); }

  .cm-card { background: #0E1E38; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
  .cm-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 14px; }
  .cm-card-head h3 { font-size: 18px; color: #fff; margin: 0; display: flex; align-items: center; gap: 10px; }
  .cm-card-head .price-tag { background: rgba(220,38,38,0.2); color: #F87171; border: 1px solid rgba(220,38,38,0.4); font-size: 13px; font-weight: 800; padding: 4px 12px; border-radius: 6px; }

  .cm-gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-top: 14px; }
  .cm-photo-item { position: relative; border-radius: 10px; overflow: hidden; background: #061122; border: 1px solid rgba(255,255,255,0.1); aspect-ratio: 4/3; group: relative; }
  .cm-photo-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
  .cm-photo-item:hover img { transform: scale(1.05); }
  .cm-photo-idx { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.7); color: #fff; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
  .cm-photo-source { position: absolute; bottom: 6px; left: 6px; background: rgba(16,185,129,0.85); color: #fff; font-size: 9.5px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
  .cm-photo-del { position: absolute; top: 6px; right: 6px; background: rgba(220,38,38,0.85); color: #fff; border: 0; border-radius: 4px; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .2s; }
  .cm-photo-item:hover .cm-photo-del { opacity: 1; }

  .cm-add-box { border: 2px dashed rgba(212,166,72,0.4); border-radius: 12px; padding: 20px; background: rgba(212,166,72,0.03); margin-top: 16px; }
  .cm-input { background: #061122; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; width: 100%; box-sizing: border-box; }
  .cm-input:focus { outline: none; border-color: #F59E0B; }

  .cm-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .cm-table th { text-align: left; padding: 12px 14px; background: rgba(0,0,0,0.3); color: #94A3B8; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .cm-table td { padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.06); color: #E2E8F0; }
  .cm-table tr:hover td { background: rgba(255,255,255,0.02); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../shared/data.js"></script>
<script src="../shared/supabase_client.js"></script>
<script src="../shared/cms.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="cruise-manager.jsx"></script>
</body>
</html>
